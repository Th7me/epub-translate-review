# Merge into a dedicated translation project's .codex/config.toml.
# Preserve existing settings; this example does not modify your Codex setup.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 2
